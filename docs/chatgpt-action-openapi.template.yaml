openapi: 3.1.0
info:
  title: Ghoghnoos Accounting Assistant
  version: 0.1.0
  description: |
    TEMPLATE ONLY — this file is not ready to be connected to a ChatGPT Action.
    The application currently authenticates this endpoint with its interactive
    ASP.NET Identity cookie. A public HTTPS deployment and a separately implemented
    OAuth/API authentication flow are required before this schema can be used.
    Only draft creation is intentionally exposed; posting, payments, deletion, and
    journal-entry operations are excluded.
servers:
  - url: https://REPLACE-WITH-PUBLIC-HTTPS-HOST
    description: Replace only after deploying the app with a stable HTTPS origin.
paths:
  /api/accounting/assistant/invoice-drafts:
    post:
      operationId: createInvoiceDraft
      summary: Create a draft sales or purchase invoice
      description: |
        Creates a draft only. Does not post the invoice or create a journal entry.
        Party resolution and tenant scope must be derived and validated by the server.
        Do not enable this operation until remote OAuth/API authentication is implemented
        and tested end-to-end.
      security:
        - OAuth2: [invoice:draft:create]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceDraftRequest'
            example:
              kind: Purchase
              partyName: Example Supplier
              invoiceDate: '2026-11-27'
              number: null
              notes: Draft created by assistant
              lines:
                - description: Example item
                  quantity: 2
                  unitPrice: 150000
                  discount: 0
                  taxRate: 0
      responses:
        '201':
          description: Draft invoice created successfully; no final posting occurred.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  number:
                    type: string
                  kind:
                    type: string
                    enum: [Sales, Purchase]
                  status:
                    type: string
                    example: Draft
                  total:
                    type: number
                  message:
                    type: string
        '400':
          description: Invalid invoice fields or amounts.
        '401':
          description: Missing or invalid integration authentication.
        '403':
          description: Authenticated integration lacks active tenant write permission.
        '404':
          description: Party not found within the authenticated tenant.
        '409':
          description: Ambiguous party name or duplicate invoice number.
        '429':
          description: Rate limit exceeded.
components:
  securitySchemes:
    OAuth2:
      type: oauth2
      description: |
        PLACEHOLDER ONLY. Implement and test the authorization and token endpoints
        before configuring ChatGPT. Never reuse the browser session cookie.
      flows:
        authorizationCode:
          authorizationUrl: https://REPLACE-WITH-PUBLIC-HTTPS-HOST/oauth/authorize
          tokenUrl: https://REPLACE-WITH-PUBLIC-HTTPS-HOST/oauth/token
          scopes:
            invoice:draft:create: Create draft invoices in the tenant linked to the authenticated user.
  schemas:
    InvoiceDraftRequest:
      type: object
      additionalProperties: false
      required: [kind, partyName, lines]
      properties:
        kind:
          type: string
          enum: [Sales, Purchase]
        partyName:
          type: string
          minLength: 1
          maxLength: 200
        invoiceDate:
          type: string
          format: date
        number:
          type: [string, 'null']
          maxLength: 40
        notes:
          type: [string, 'null']
          maxLength: 500
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [description, quantity, unitPrice, discount, taxRate]
            properties:
              description:
                type: string
                minLength: 1
                maxLength: 200
              quantity:
                type: number
                exclusiveMinimum: 0
                maximum: 1000000000
                description: Maximum 3 decimal places.
              unitPrice:
                type: number
                minimum: 0
                maximum: 1000000000000
                description: Maximum 2 decimal places.
              discount:
                type: number
                minimum: 0
                description: Maximum 2 decimal places; cannot exceed rounded line gross amount.
              taxRate:
                type: number
                minimum: 0
                maximum: 100
                description: Percentage; maximum 2 decimal places.
