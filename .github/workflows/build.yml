name: Build

on:
  push:
    branches: [ main, "feature/**", "fix/**" ]
  pull_request:
    branches: [ main, "feature/**" ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore application
        run: dotnet restore GhoghnoosAcc.csproj
      - name: Build application
        run: dotnet build GhoghnoosAcc.csproj --configuration Release --no-restore
      - name: Restore tests
        run: dotnet restore tests/GhoghnoosAcc.Tests/GhoghnoosAcc.Tests.csproj
      - name: Run automated tests
        run: dotnet test tests/GhoghnoosAcc.Tests/GhoghnoosAcc.Tests.csproj --configuration Release --no-restore --logger "console;verbosity=normal"
